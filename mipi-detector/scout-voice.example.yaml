# Start with: ./mipi-detector/scout.sh --config mipi-detector/scout-voice.example.yaml
# Add --no-stt for spoken replies without recognition, or --no-tts for recognition only.
version: 1

scout:
  camera: "imx678 6-0042"
  width: 1920
  height: 1080
  fps: 30
  auto_checks: true
  inspection_interval: 3.0
  usb_camera: auto
  host: 10.42.0.1
  allow_cpu_fallback: true
  vlm_model: /media/nvme/llima/models/Gemma-4-E4B-it-GPTQ-a16w4-8k-deploy

speech:
  enabled: true
  implementation_repo: /workspace/GitHub/sima-ai
  launcher_python: /workspace/GitHub/sima-ai/jarvic_venv/bin/python
  runtime_dir: /home/sima/.cache/neat-scout/speech

  stt:
    enabled: true
    input: browser
    activation: toggle_button
    submit_on_stop: true
    target: subject_mission
    task: transcribe
    language: auto
    record_seconds: 30
    sample_rate_hz: 16000
    channels: 1
    sample_format: pcm_s16le
    upload_max_bytes: 1048576
    request_timeout_seconds: 120

  tts:
    enabled: true
    output: browser
    voice: M1
    language: en
    speed: 1.0
    speak_subject_results: true
    speak_watch_inspection_results: true
    speak_occupancy_events: false
    request_timeout_seconds: 120

  scheduler:
    serialize_inference: false
    pause_capture_for: []
    speech_worker_lifetime: application
    # Load the enabled models once; stop/restart the whole group to release memory.
    release_gemma_for_speech: false
    keep_preview_encoders: true
    stop_all_models_together: true
    max_pending_voice_jobs: 1
    startup_timeout_seconds: 180

# These fields use sima-ai's existing speech-server configuration schema.
# SCOUT passes only the relevant subset to its launcher, not the whole file.
model_servers:
  whisper:
    python: /home/sima/pyneat/bin/python3
    host: 127.0.0.1
    port: 9996
    model: /media/nvme/llima/models/whisper-medium-a16w8-layered-encoder
    served_name: whisper-medium
    pid_file: /home/sima/.cache/neat-scout/speech/whisper.pid

  supertonic:
    python: /home/sima/pyneat/bin/python3
    host: 127.0.0.1
    port: 9995
    repository: /workspace/GitHub/sima-ai/supertonic-sima
    model_root: /media/nvme/llima/models
